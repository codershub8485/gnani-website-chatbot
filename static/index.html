<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gnani.ai Assistant</title>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --text: #1b1f2a; --muted: #6b7280; --border: #e5e7eb;
    --accent: #4f46e5; --accent-text: #ffffff; --user: #4f46e5; --bot: #f1f2f6;
    --warn-bg: #fff7ed; --warn-border: #fdba74; --warn-text: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117; --panel: #171a23; --text: #e6e8ee; --muted: #9aa3b2; --border: #2a2f3c;
      --accent: #818cf8; --accent-text: #0f1117; --user: #6366f1; --bot: #222634;
      --warn-bg: #2a1d12; --warn-border: #9a5b2a; --warn-text: #fdba74;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  .app { max-width: 820px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
  header { padding: 18px 0 12px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.bot.refused { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); }
  .msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot ul { margin: 4px 0 8px; padding-left: 20px; }
  .msg a { color: inherit; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
         padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; margin-bottom: 6px; opacity: .8; }
  .sources { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 13px; }
  .sources a { display: block; color: var(--accent); text-decoration: none; }
  .sources a:hover { text-decoration: underline; }
  .typing { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 10px; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 999px;
          padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px 0 18px; border-top: 1px solid var(--border); }
  input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
          background: var(--panel); color: var(--text); font: inherit; font-size: 16px; /* 16px stops iOS zoom-on-focus */ }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button[type=submit] { padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent);
          color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  @media (max-width: 600px) {
    /* phones: suggestions become one swipeable row instead of several wrapped rows */
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; }
    header { padding: 12px 0 8px; }
    header p { font-size: 12px; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Gnani.ai Assistant</h1>
    <p>Answers questions about Gnani AI using only content from gnani.ai. Other questions are politely declined.</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <input id="input" autocomplete="off" maxlength="1000" placeholder="Ask about Gnani AI's products, models, customers…" aria-label="Your question">
    <button type="submit" id="send">Send</button>
  </form>
</div>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];

const SUGGESTIONS = [
  "What does Gnani AI do?",
  "What is Gnani Prisma?",
  "Who founded Gnani AI?",
  "Which industries do you serve?",
  "Who is the Prime Minister of India?",
];
const chips = document.getElementById("chips");
for (const s of SUGGESTIONS) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = s;
  b.onclick = () => ask(s);
  chips.appendChild(b);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// Minimal, safe Markdown: escape first, then bold, links and bullet lists.
function renderMarkdown(md) {
  const inline = t => escapeHtml(t)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  let html = "", list = false;
  for (const raw of md.split("\n")) {
    const line = raw.trim();
    const item = line.match(/^[-*•]\s+(.*)$/) || line.match(/^\d+[.)]\s+(.*)$/);
    if (item) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(item[1])}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (line) html += `<p>${inline(line.replace(/^#+\s*/, ""))}</p>`;
  }
  return html + (list ? "</ul>" : "");
}

function addUser(text) {
  const d = document.createElement("div");
  d.className = "msg user"; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function addBot(reply) {
  const d = document.createElement("div");
  const refused = ["out_of_scope", "not_found", "blocked", "error"].includes(reply.status);
  d.className = "msg bot" + (refused ? " refused" : "");
  const labels = { out_of_scope: "Outside website scope", not_found: "Not on gnani.ai", blocked: "Declined", error: "Error" };
  let html = labels[reply.status] ? `<span class="tag">${labels[reply.status]}</span>` : "";
  html += renderMarkdown(reply.answer);
  if (reply.sources && reply.sources.length) {
    html += '<div class="sources"><strong>Sources</strong>' + reply.sources.map(s =>
      `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a>`).join("") + "</div>";
  }
  d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

async function ask(text) {
  text = text.trim();
  if (!text || send.disabled) return;
  input.value = ""; send.disabled = true;
  addUser(text);
  const typing = document.createElement("div");
  typing.className = "msg bot typing"; typing.textContent = "Searching gnani.ai…";
  log.appendChild(typing); log.scrollTop = log.scrollHeight;
  const started = Date.now();
  const timer = setInterval(() => {
    const s = Math.round((Date.now() - started) / 1000);
    typing.textContent = s < 8 ? `Searching gnani.ai… ${s}s`
      : `Still working… ${s}s. The free LLM tier allows about 2 questions a minute, so the answer is queued and will arrive shortly.`;
  }, 1000);
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: history.slice(-8) }),
    });
    const reply = res.ok ? await res.json()
      : { status: "error", answer: `Request failed (${res.status}).`, sources: [] };
    typing.remove(); addBot(reply);
    if (reply.status !== "error") history.push({ role: "user", content: text }, { role: "assistant", content: reply.answer });
  } catch (e) {
    typing.remove(); addBot({ status: "error", answer: "Could not reach the server.", sources: [] });
  } finally {
    clearInterval(timer);
    send.disabled = false; input.focus();
  }
}

form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
addBot({ status: "chit_chat", answer: "Hi! Ask me anything about Gnani AI. I answer only from the gnani.ai website.", sources: [] });
input.focus();
</script>
</body>
</html>
