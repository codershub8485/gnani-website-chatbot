# Render Blueprint: one-click deploy of the chatbot as a free web service.
# Render asks for GROQ_API_KEY during setup (sync: false keeps it out of the repo).
services:
  - type: web
    name: gnani-website-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GNANI_LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
